name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoRead-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "LingoRead v1.0.0 (Android APK)"
          body: |
            ## 📚 LingoRead - Android APK

            LingoRead uygulamasının ilk Android APK sürümü hazır!
            
            ### Yenilikler & Özellikler:
            - 108 adet uluslararası gazete haberi ve kısa hikaye
            - Sarı parıltılı, tıklanabilir interaktif kelime deneyimi
            - 5.220 kelimelik çevrimdışı Türkçe sözlük ve lemmatizer
            - Her metin için okuduğunu anlama testi (quiz)
            - Flashcard kelime kartları çalışma modu
            
            Aşağıdaki `LingoRead-release.apk` dosyasını telefonunuza indirip yükleyebilirsiniz.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
